name: Windows 64-bit

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - zig
          - mingw64

    steps:

    - name: Init MSYS2
      uses: msys2/setup-msys2@v2
      with:
        location: d:/
        update: true
        install: >
          mingw-w64-x86_64-github-cli
          mingw-w64-x86_64-minizip
          mingw-w64-x86_64-make
          mingw-w64-x86_64-postgresql
          mingw-w64-clang-x86_64-github-cli
          mingw-w64-clang-x86_64-minizip
          mingw-w64-clang-x86_64-make
          mingw-w64-clang-x86_64-postgresql
          bzip2
          xz
          unzip
          patch
          diffutils
          make
          git

    - uses: actions/checkout@v2
      with:
       repository: alcz/hbpksrc
       path: hbpksrc

    - name: Prepare environment
      shell: msys2 {0}
      run: |
        mkdir /opt/hbpk
        rm -rf hbpksrc/packages
        echo verbose=off > $HOME/.wgetrc
        if [ "${{matrix.compiler}}" = "mingw64" ]; then
          pacman -S --noconfirm mingw-w64-x86_64-binutils
          pacman -S --noconfirm mingw-w64-x86_64-gcc
        fi

    - name: Get previous successful run ID
      id: get_run
      continue-on-error: true
      shell: msys2 {0}
      run: |
        cd hbpksrc
        # ignore artifacts, when a forced rebuild goes
        if ! git log --oneline -n1 | grep -Fq "[corebuild]"; then
          PREV_RUN_ID=$(gh run list --workflow="${{ github.workflow }}" --limit=1 --status=success --json databaseId -q '.[0].databaseId')
          echo "Previous successful run ID: $PREV_RUN_ID"
          echo "run_id=$PREV_RUN_ID" >> $GITHUB_OUTPUT
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Get previously built packages
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: packages-x86_64-windows-gnu-${{matrix.compiler}}
        path: packages-x86_64-windows-gnu-${{matrix.compiler}}-last
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: ${{ steps.get_run.outputs.run_id }}

    - name: Build base of hbpk
      shell: msys2 {0}
      run: |
        export PATH="/opt/hbpk/bin:/usr/bin:$PATH"
        export HBPK_BOOTCAT=no # shouldn't build hbpk-sizecat in CI at all
        cd hbpksrc/base
        HBPK_XZ_FLAVOR=-inherit make install
        cat /opt/hbpk/bin/hbpk-del | sed -e 's/hbpk-sizecat -nosize/cat/' > /tmp/hbpk-del
        mv /tmp/hbpk-del /opt/hbpk/bin/hbpk-del # another patch for extra argument
        chmod 755 /opt/hbpk/bin/hbpk-del
        ln -f -s /usr/bin/cat.exe /opt/hbpk/bin/hbpk-sizecat.exe

    - name: Build a selection of packages
      shell: msys2 {0}
      run: |
        export PATH="/opt/hbpk/bin:/opt/hbpk/harbour/bin/win/${{matrix.compiler}}:$PATH"
        # expired artifact leaves empty directory(?)
        rmdir --ignore-fail-on-non-empty packages-x86_64-windows-gnu-${{matrix.compiler}}-last || true
        if [ -d "packages-x86_64-windows-gnu-${{matrix.compiler}}-last" ]; then
          mv packages-x86_64-windows-gnu-${{matrix.compiler}}-last/harbour-core*.hbpk hbpksrc/packages/
          if [ "${{matrix.compiler}}" = "zig" ]; then
            mv packages-x86_64-windows-gnu-${{matrix.compiler}}-last/zig*.hbpk hbpksrc/packages/
          fi
          cd hbpksrc/packages
          if [ "${{matrix.compiler}}" = "zig" ]; then
            hbpk-add zig*.hbpk
          fi
          hbpk-add harbour-core*onedir.hbpk
          cd ../build
        else
          cd hbpksrc/build
          if [ "${{matrix.compiler}}" = "zig" ]; then
             PKGSELECTION=zig-binary make install
          fi
          HBPK_COMPILER=${{matrix.compiler}} PKGSELECTION=harbour-core make install
          cd harbour-core-onedir
          mv ../harbour-core/harbour-* ./ # only redo the install
          touch .config .depend .extract .fetch .patch
          cd ..
          HBPK_COMPILER=${{matrix.compiler}} PKGSELECTION=harbour-core-onedir make install
        fi
        wget https://harbour.zip/packages/x86_64-windows-gnu/libpq-9.6.24+outdatedssl+testonly.hbpk
        hbpk-add libpq-9.6.24+outdatedssl+testonly.hbpk
        rm libpq-9.6.24+outdatedssl+testonly.hbpk
        if [ "${{matrix.compiler}}" = "mingw64" ]; then
           export PATH="/mingw64/bin:$PATH"
        fi
        HB_COMPILER=${{matrix.compiler}} HBPK_COMPILER=${{matrix.compiler}} PKGSELECTION=" \
          letodbf-server-elch \
          letodbf-server-alcz \
          letodbf-rdd-elch \
          letodbf-rdd-alcz \
          harbour-yaml \
          harbour-crypto \
          curl-for-win-binary \
          harbour-curl \
          hwgui \
          harbour-pgsql \
          libduckdb-binary \
          hbduckdb-wensheng \
          libpq-inherit \
          harbour-pgsql \
          hbimgui \
          hbimgui-docking \
          hbimgui-yadbu \
          pdfium-binary \
          " \
        make install IGNORE_ERRORS=1

    - name: Run tests
      shell: msys2 {0}
      run: |
        /opt/hbpk/harbour/bin/win/${{matrix.compiler}}/hbtest

    - name: 'Extend environment for deps that need GNU tools to build'
      shell: msys2 {0}
      run: |
        pacman -S --noconfirm mingw-w64-x86_64-binutils
        pacman -S --noconfirm mingw-w64-x86_64-gcc

    - name: Build packages depending on OpenSSL
      continue-on-error: true
      shell: msys2 {0}
      run: |
        export PATH="/opt/hbpk/bin:/opt/hbpk/harbour/bin/win/${{matrix.compiler}}:$PATH"
        # OpenSSL seems to require windres (linking tools stage), windres wants GCC
        if [ -d "packages-x86_64-windows-gnu-${{matrix.compiler}}-last" ]; then
          mv packages-x86_64-windows-gnu-${{matrix.compiler}}-last/openssl*.hbpk hbpksrc/packages/
          mv packages-x86_64-windows-gnu-${{matrix.compiler}}-last/zlib*.hbpk hbpksrc/packages/
          mv packages-x86_64-windows-gnu-${{matrix.compiler}}-last/cmake*.hbpk hbpksrc/packages/
          mv packages-x86_64-windows-gnu-${{matrix.compiler}}-last/harbour-ssl*.hbpk hbpksrc/packages/
          cd hbpksrc/packages
          hbpk-add zlib*.hbpk
          hbpk-add cmake*.hbpk
          hbpk-add openssl*.hbpk
          hbpk-add harbour-ssl*.hbpk
          cd ../build
        else
          cd hbpksrc/build
          HBPK_OPENSSL_OPTS="no-tests no-apps" PKGSELECTION="zlib cmake-binary openssl" make install
        fi
        if [ "${{matrix.compiler}}" = "mingw64" ]; then
           export PATH="/mingw64/bin:$PATH"
        fi
        OPENSSL_ROOT_DIR="/opt/hbpk" \
        HB_COMPILER=${{matrix.compiler}} HBPK_COMPILER=${{matrix.compiler}} PKGSELECTION=" \
          harbour-ssl \
          libcotp \
          hbotp-naldodj \
          libssh2 \
          hbssh2-alkresin \
          hix \
          " \
        make install IGNORE_ERRORS=1

    - name: Build debug version(s) of Harbour core
      continue-on-error: true
      shell: msys2 {0}
      run: |
        export PATH="/opt/hbpk/bin:/opt/hbpk/harbour/bin/win/${{matrix.compiler}}:$PATH"
        if [ ! -d "packages-x86_64-windows-gnu-${{matrix.compiler}}-last" ]; then
          cd hbpksrc/build/harbour-core-debug
          mv ../harbour-core-onedir/harbour-* ./ # only redo some parts
          touch .config .depend .extract .fetch .patch
          cd harbour-*
          HBPK_COMPILER=${{matrix.compiler}} make clean
          cd ..
          HBPK_USER_CFLAGS=-fno-sanitize-trap=undefined HBPK_COMPILER=${{matrix.compiler}} PKGSELECTION=harbour-core-debug make install
          cd harbour-*
          HBPK_COMPILER=${{matrix.compiler}} make clean
          cd ..
          HBPK_BLD_SUFFIX=+sanitizer HBPK_COMPILER=${{matrix.compiler}} PKGSELECTION=harbour-core-debug make install
        fi

    - name: Rename artifacts
      shell: msys2 {0}
      run: |
        cd hbpksrc
        mv packages packages-x86_64-windows-gnu-${{matrix.compiler}}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: packages-x86_64-windows-gnu-${{matrix.compiler}}
        path: hbpksrc/packages-x86_64-windows-gnu-${{matrix.compiler}}/*
